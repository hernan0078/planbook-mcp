interface:
  display_name: "Planbook Lesson Workflow"
  short_description: "Write or bulk extract Planbook lessons"
  default_prompt: "Use $planbook-lesson-entry to write or extract Planbook lessons for the requested dates and periods."

dependencies:
  tools:
    - type: "mcp"
      value: "planbook"
      description: "Local Planbook lesson write and extraction MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
